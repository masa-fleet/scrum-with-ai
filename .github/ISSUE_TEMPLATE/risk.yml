name: ⚠️ リスク
description: リスクの発生確率、影響度、対策をまとめて管理するためのテンプレートです。
title: "[Risk] "
labels:
  - risk
body:
  - type: markdown
    attributes:
      value: |
        以下を記入し、リスクの内容と重要度、軽減アクションを明確化してください。

  - type: textarea
    id: risk-statement
    attributes:
      label: "🚨 Risk Statement"
      description: "何が起きる可能性があるか、1文で明確に記述してください。"
      placeholder: "例: 新しい API で権限チェックが欠けると機密データが漏洩する可能性がある。"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "📖 Background & Context"
      description: "このリスクが重要になる背景（対象システム、前提、参照情報）を記載してください。"
      placeholder: "発生要因と影響範囲を明示してください。"
    validations:
      required: true

  - type: dropdown
    id: likelihood
    attributes:
      label: "🎲 Likelihood"
      description: "このリスクが発生する可能性を評価してください。"
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "💥 Impact"
      description: "発生した場合の影響度を評価してください。"
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: mitigation-plan
    attributes:
      label: "🛡️ Mitigation Plan"
      description: "発生確率や影響を下げるために取る対策をリスト化してください。"
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
