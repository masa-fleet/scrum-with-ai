name: 🗺️ エピック
description: 複数スプリントにまたがる大規模な取り組みを、複数の PBI として登録するためのテンプレートです。
title: "[Epic] "
labels:
  - epic
body:
  - type: markdown
    attributes:
      value: |
        以下を記入して、チームと AI 補助システムが本エピックの目的、事業への影響、完了条件を短時間で理解できるようにしてください。

  - type: textarea
    id: goal
    attributes:
      label: "🎯 Goal / Outcome"
      description: "このエピックで最終的に目指す状態（成果）を記載してください。"
      placeholder: |
        例: ソーシャルログイン（Google/GitHub）導入で会員登録導線を改善し、CVR を引き上げる。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "📖 Background & Context"
      description: "なぜこのエピックが必要か。背景の問題、機会、根拠情報を簡潔にまとめてください。"
      placeholder: |
        例: 現在は username/password での登録のみで、離脱率が高いため。ソーシャルログインは導線摩擦を下げる実績がある。
    validations:
      required: true

  - type: textarea
    id: business-value
    attributes:
      label: "💼 Business Value & Success Metrics"
      description: "事業価値と成功指標を記載してください。測定可能な指標を具体的に。"
      placeholder: |
        事業価値:
        - 新規登録の離脱を減らし、獲得効率を改善する。
        - 初期導線の完了時間を短縮する。

        成功指標:
        - リリース 30 日後の新規登録完了率を X% → Y% に引き上げる。
        - アカウント・パスワード関連の問い合わせ件数を Z% 削減する。
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: "✅ Definition of Done"
      description: "エピック完了とみなす条件と、対象外（スコープ外）を明確に記載してください。"
      value: |
        ### In Scope
        - [ ] 
        - [ ] 
        - [ ] 

        ### Out of Scope
        - 
        - 
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "📝 Additional Notes"
      description: "任意: 依存関係、リスク、技術制約、設計判断など、計画に必要な追加情報。"
      placeholder: |
        例: 本番基盤の ID 連携移行（Epic #100）を前提とする。OAuth ライブラリ選定前にセキュリティ担当と確認する。
    validations:
      required: false
