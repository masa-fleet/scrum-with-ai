name: 🗺️ Epic
description: 複数の Sprint にまたがり、複数の PBI を含む大きな作業を記述します。
title: "[Epic] "
labels:
  - epic
body:
  - type: markdown
    attributes:
      value: |
        チームと AI アシスタントが Epic の長期的なゴール、ビジネスへの影響、完了条件を理解できるよう、以下の項目を入力してください。

  - type: textarea
    id: goal
    attributes:
      label: "🎯 ゴール / 成果"
      description: "この Epic で長期的に達成したい成果は何ですか？目指す最終状態を記述してください。"
      placeholder: |
        例: Google や GitHub などのソーシャルログインを利用可能にし、サインアップ時の負担を減らしてコンバージョン率を向上させる。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "📖 背景・コンテキスト"
      description: "なぜこの Epic が必要ですか？対象となる課題や機会を、関連する戦略文書、過去の議論、リンクとともに記述してください。"
      placeholder: |
        例: 現在はユーザー名とパスワードによるアカウント作成が必須であり、調査では 40% のユーザーがこの段階でサインアップを中断している。ソーシャルログインによってこの負担を軽減できる。
    validations:
      required: true

  - type: textarea
    id: business-value
    attributes:
      label: "💼 ビジネス価値・成功指標"
      description: "この Epic がもたらすビジネス価値と、成功を判断するための具体的で観測可能な指標を記述してください。"
      placeholder: |
        ビジネス価値:
        - 新規ユーザーの負担を軽減し、サインアップの中断を減らす。
        - オンボーディングを迅速化し、月間アクティブユーザー数を増やす。

        成功指標:
        - リリース後 30 日以内にサインアップのコンバージョン率が X% から Y% に向上する。
        - アカウントやパスワードに関するサポートチケットが Z% 減少する。
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: "✅ 完了の定義"
      description: "この Epic の完了に必要な条件を列挙してください。明示的に対象外とする内容も含めてください。"
      value: |
        ### 対象範囲
        - [ ] 
        - [ ] 
        - [ ] 

        ### 対象外
        - 
        - 
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "📝 補足"
      description: "任意: 依存関係、リスク、技術的制約、アーキテクチャ上の決定など、計画に役立つ情報を記述してください。"
      placeholder: |
        例: ID サービスの新しいプラットフォームへの移行（Epic #100）に依存する。OAuth ライブラリを選定する前にセキュリティチームへ相談する。
    validations:
      required: false
