name: 📋 プロダクトバックログ項目 (PBI)
description: このテンプレートで Scrum チームの新しい PBI を定義できます。
title: "[PBI] "
labels:
  - pbi
body:
  - type: markdown
    attributes:
      value: |
        ## プロダクトバックログ項目
        何を、なぜ作るのかをチームと AI 補助システムがすぐに理解できるよう、下記を記入してください。

  - type: textarea
    id: goal
    attributes:
      label: "🎯 Goal"
      description: "この PBI が完了したときに達成する状態（成果）を記載してください。"
      placeholder: |
        例: ユーザーがパスワード再設定メールでアカウント復旧できるようにし、サポート依存を下げる。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "📖 Background & Context"
      description: "なぜ今必要か、問題・影響・関連情報を簡潔に説明してください。"
      placeholder: |
        例: パスワードを忘れた場合にログイン不能になり、サポート依頼が増加して離脱が起きているため。
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Acceptance Criteria"
      description: "この PBI を完了と見なす条件をチェックリストで記載してください。実装方法ではなく、達成基準を中心に書きます。"
      placeholder: |
        - [ ] ユーザーはログイン画面からパスワード再設定を申請できる。
        - [ ] 再設定メールが送信され、リンクから新しいパスワードを設定できる。
        - [ ] 新しいパスワードでログインできる状態になる。
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "📝 Additional Notes"
      description: "任意: 技術的なヒント、設計上の制約、依存関係など。"
      placeholder: "例: 関連 PR、API 制約、性能要件など。"
    validations:
      required: false
