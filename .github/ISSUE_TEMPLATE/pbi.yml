name: 📋 Product Backlog Item (PBI)
description: Scrum Team の新しい PBI を記述します。
title: "[PBI] "
labels:
  - pbi
body:
  - type: markdown
    attributes:
      value: |
        ## Product Backlog Item
        チームと AI アシスタントが、作るものとその理由をすぐに理解できるよう、以下の項目を入力してください。

  - type: textarea
    id: goal
    attributes:
      label: "🎯 ゴール"
      description: "この PBI の完了時に達成すべき成果は何ですか？実現方法ではなく、提供するものに焦点を当ててください。"
      placeholder: |
        例: ユーザーがメールでパスワードをリセットでき、サポートの支援なしでアカウントへのアクセスを回復できる。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "📖 背景・コンテキスト"
      description: "なぜ今これが必要ですか？課題、影響、参考になるリンクやコンテキストを記述してください。"
      placeholder: |
        例: パスワードを忘れたユーザーがログインできず、サポートチケットの増加と離脱につながっている。
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ 受け入れ条件"
      description: "この PBI の完了に必要な条件をチェックボックスで列挙してください。実装方法ではなく、期待する成果に焦点を当てます。5 項目程度に収め、各項目に出力形式と保存場所を明記してください。5 項目を超え、PBI の Estimate が 8 より大きい場合は PBI を分割してください。"
      placeholder: |
        - [ ] ユーザーがサインイン画面からパスワードのリセットを要求できる。
        - [ ] ユーザーが有効なリセットメールを受信し、新しいパスワードを設定できる。
        - [ ] ユーザーが更新後のパスワードで正常にサインインできる。
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "📝 補足"
      description: "任意: 技術的なヒント、設計上の制約、依存関係など、AI を活用した計画に役立つ情報を記述してください。"
      placeholder: "例: 関連する PR、API の制約、パフォーマンス要件など。"
    validations:
      required: false
